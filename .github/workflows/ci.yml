# Verificação de cada push e pull request.
#
# Roda o que o runbook manda rodar à mão: varredura de credenciais, contrato
# da baseline legada, suíte do backend contra PostgreSQL e Redis reais,
# ida-e-volta da migration mais recente, testes, tipos e build do frontend.
#
# Nenhum job usa segredo do repositório: os bancos são contêineres
# descartáveis do próprio runner, e os valores abaixo só existem ali.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Só leitura: nenhum job publica nada nem escreve no repositório.
permissions:
  contents: read

# Um push novo na mesma branch cancela a verificação anterior, que já não
# diz nada sobre o código atual.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Credenciais e baseline legada
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Varredura de credenciais
        run: python tools/credential_scan.py
      - name: Testes do scanner
        working-directory: tools
        run: python -m unittest test_credential_scan -v
      - name: Dependências de leitura do PDF legado
        run: pip install -r belo-vale-ii-projeto-completo/plataforma/requirements-import.txt
      - name: Contrato do estado canônico
        run: |
          python -m unittest belo-vale-ii-projeto-completo/testes/test_state_contract.py -v
          python -m unittest belo-vale-ii-projeto-completo/testes/test_import_relatorio_animais.py -v
      - name: Validação da baseline
        run: >-
          python belo-vale-ii-projeto-completo/plataforma/build_platform_state.py validate
          --canonical belo-vale-ii-projeto-completo/plataforma/state_canonical.json

  api:
    name: Backend (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ingestion
          POSTGRES_USER: ingestion
          POSTGRES_PASSWORD: ci-descartavel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ingestion -d ingestion"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_URL: postgresql+asyncpg://ingestion:ci-descartavel@localhost:5432/ingestion
      # Banco 15: os testes do limitador de login usam prefixos próprios, e
      # manter o banco separado deixa isso explícito.
      REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Dependências (lock congelado)
        run: uv sync --frozen
      - name: Migrations
        run: uv run --frozen alembic upgrade head
      - name: A migration mais recente desce e sobe
        run: |
          uv run --frozen alembic downgrade -1
          uv run --frozen alembic upgrade head
      - name: Testes
        run: uv run --frozen pytest -q

  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Dependências (lock congelado)
        run: npm ci --no-audit --no-fund
      - name: Testes
        run: npx vitest run
      - name: Tipos e build de produção
        run: npm run build

  e2e:
    name: E2E (pilha Docker completa + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Segredos descartáveis, gerados no próprio runner: nenhum valor sai
      # daqui nem vem do repositório.
      - name: Ambiente do E2E
        run: |
          PG="$(openssl rand -hex 24)"
          {
            echo "COMPOSE_PROJECT_NAME=belo-vale-e2e"
            echo "POSTGRES_PASSWORD=${PG}"
            echo "POSTGRES_URL=postgresql+asyncpg://ingestion:${PG}@db:5432/ingestion"
            echo "MINIO_ACCESS_KEY=e2e$(openssl rand -hex 6)"
            echo "MINIO_SECRET_KEY=$(openssl rand -hex 24)"
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo "PHOTO_SHEETS_DEMO=true"
          } > infra/.env.e2e
      # O worker não tem verificação de saúde (é um processo Celery, sem porta
      # HTTP), e algumas versões do Compose recusam `--wait` nesse caso. Por
      # isso: sobe tudo, espera só quem tem verificação (api e web, com db,
      # redis e minio por dependência) e confere o worker à parte.
      - name: Subir a pilha
        run: |
          docker compose --env-file infra/.env.e2e -f infra/docker-compose.yml up -d --build
          docker compose --env-file infra/.env.e2e -f infra/docker-compose.yml up -d --wait --wait-timeout 180 api web
          test -n "$(docker compose --env-file infra/.env.e2e -f infra/docker-compose.yml ps --status running -q worker)"
      - name: Migrations
        run: docker compose --env-file infra/.env.e2e -f infra/docker-compose.yml exec -T api uv run --no-sync alembic upgrade head
      # `/healthz` não toca o banco, então a API passa por "saudável" antes de
      # abrir a primeira conexão real ao Postgres (a engine do SQLAlchemy é
      # preguiçosa, e `pool_pre_ping` soma outro round-trip nessa primeira
      # vez). Sem isto, o primeiro teste do Playwright é quem paga esse custo
      # — e um runner compartilhado pode levar mais que o tempo padrão de
      # asserção, derrubando só o primeiro teste da suíte.
      #
      # /api/auth/refresh com um cookie inválido consulta o banco (procura o
      # token) e devolve 401 sem passar pelo limitador de tentativas de
      # login — diferente de POST /api/auth/login, que contaria como uma
      # falha e, somado às falhas propositais dos próprios testes, poderia
      # acumular até bloquear a origem numa suíte rodada mais de uma vez
      # seguida contra o mesmo Redis.
      - name: Aquecer a conexão da API com o banco
        run: |
          curl -s -o /dev/null -X POST http://localhost:8080/api/auth/refresh             --cookie "bv_refresh=warmup-nao-e-uma-sessao-real"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Dependências e navegador
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test
      - name: Relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7
      - name: Logs da pilha em caso de falha
        if: failure()
        run: docker compose --env-file infra/.env.e2e -f infra/docker-compose.yml logs --no-color --tail 200
