server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeçalhos de segurança ---
    #
    # A aplicação fica exposta na internet pública e é usada por pessoas não
    # técnicas, então o navegador precisa recusar sozinho o que a aplicação
    # nunca faz.

    # A SPA é servida desta origem e não carrega script, estilo ou fonte de
    # fora. `default-src 'self'` corta injeção de terceiros; o `'unsafe-inline'`
    # em style-src é necessário porque React aplica estilos inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Impede que o navegador adivinhe o tipo de um arquivo e execute como
    # script algo que foi enviado como imagem.
    add_header X-Content-Type-Options "nosniff" always;

    # Nenhuma página daqui deve ser embutida em outro site: barra clickjacking
    # sobre botões que mudam dados do rebanho.
    add_header X-Frame-Options "DENY" always;

    # Não vaza o caminho interno para sites externos.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # O microfone só para a própria página: é por ele que o funcionário grava
    # a ordenha dentro do app. Nenhuma outra origem pode pedir. Câmera e
    # localização continuam fechadas: a foto da folha usa o campo de arquivo,
    # que abre a câmera do sistema e não depende desta permissão.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), interest-cohort=()" always;

    # HSTS: o navegador passa a recusar este endereço sem HTTPS. O HTTPS
    # termina no Tailscale Funnel, neste PC; pela regra do padrão (RFC 6797),
    # o navegador ignora este cabeçalho quando ele chega por http:// — então
    # a demonstração e o E2E em http://localhost não são afetados. Sem
    # includeSubDomains nem preload: vale só para o endereço do sistema.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # A versão do nginx não é da conta de quem está do lado de fora.
    server_tokens off;

    # Same-origin proxy: the browser only ever talks to this nginx origin,
    # so the SPA needs no CORS handling and no cross-origin API base URL.
    location /api/ {
        # O padrao do nginx e 1 MB, e a foto da folha ja passa disso quando o
        # celular nao comprime; uma gravacao de um minuto passa sempre. Sem
        # esta linha o envio morre aqui, com corpo HTML que o app nao sabe
        # ler. O limite da aplicacao (MAX_UPLOAD_BYTES) continua menor.
        client_max_body_size 20m;

        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://api:8000/healthz;
    }

    # --- Arquivos do app ---
    #
    # Comprimidos: sem isto o app chegava com 284 kB de JS e 58 kB de CSS
    # crus, o triplo do necessario no sinal fraco do curral. So os arquivos
    # do app: a API (acima) fica sem compressao, porque comprimir resposta que
    # carrega token abre espaco para o ataque BREACH.
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;

    # /assets/ tem o conteudo no nome (index-AbC123.js): o arquivo nunca muda,
    # pode ficar no aparelho por um ano. `expires` nao substitui os
    # cabecalhos de seguranca acima, como um add_header aqui faria.
    location /assets/ {
        gzip on;
        expires 1y;
        try_files $uri =404;
    }

    # A pagina, o sw.js e o manifesto mudam a cada versao com o mesmo nome.
    # Sem instrucao de cache o navegador escolhe sozinho quanto tempo reusar
    # a copia (ate ~1 dia, pela idade do arquivo), e o celular segue abrindo
    # a versao antiga depois de uma atualizacao. `no-cache` faz perguntar
    # sempre; igual, volta 304 sem corpo. `expires`, e nao add_header, para
    # nao derrubar os cabecalhos de seguranca.
    location / {
        gzip on;
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
