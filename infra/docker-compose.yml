services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: runtime
    environment:
      ENVIRONMENT: development
      RUNTIME_ROLE: api
      POSTGRES_URL: ${POSTGRES_URL:?Set POSTGRES_URL in the server environment}
      REDIS_URL: redis://redis:6379/0
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in the server environment}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in the server environment}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the server environment}
      # Mostra a área "Fichas" com o OCR falso. Só para demonstração e para o
      # E2E do fluxo de foto; a API recusa subir com isto em produção.
      PHOTO_SHEETS_DEMO: ${PHOTO_SHEETS_DEMO:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks: [ingestion_private, ingestion_edge]

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: runtime
    command: ["uv", "run", "--no-sync", "celery", "-A", "app.workers.tasks", "worker", "--loglevel=info"]
    healthcheck:
      disable: true
    environment:
      ENVIRONMENT: development
      RUNTIME_ROLE: worker
      POSTGRES_URL: ${POSTGRES_URL:?Set POSTGRES_URL in the server environment}
      REDIS_URL: redis://redis:6379/0
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in the server environment}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in the server environment}
      # Quem lê a foto. "fake" (padrão) inventa leitura e serve ao CI e à
      # demonstração; "ollama" lê de verdade, no endereço abaixo.
      READER_PROVIDER: ${READER_PROVIDER:-fake}
      READER_URL: ${READER_URL:-http://host.docker.internal:11434}
      READER_MODEL: ${READER_MODEL:-qwen2.5vl:7b}
      # Quem ouve a gravação. "fake" (padrão) devolve sempre a mesma frase;
      # "whisper" transcreve de verdade no whisper-server (porta 8081 — a
      # 8080 é a do app). Mesma regra: só endereço da própria máquina ou da
      # rede interna.
      AUDIO_PROVIDER: ${AUDIO_PROVIDER:-fake}
      AUDIO_URL: ${AUDIO_URL:-http://host.docker.internal:8081}
      AUDIO_MODEL: ${AUDIO_MODEL:-ggml-large-v3-turbo-q5_0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # O modelo roda fora do Docker quando a GPU não passa para o contêiner
    # (é o caso da AMD no Windows); este apelido é como o worker alcança o
    # hospedeiro. Num servidor Linux, o Ollama vira um serviço aqui e o
    # endereço passa a ser http://ollama:11434, sem mudar código.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # `reader_link` existe só para alcançar o leitor: `ingestion_private` não
    # tem rota para fora, nem para o hospedeiro. O preço é o worker ganhar
    # saída; o que segura isso é a guarda de endereço (só privado) e o
    # padrão continuar sendo o leitor falso.
    networks: [ingestion_private, reader_link]

  # Opt-in test target. `docker compose --profile test run --rm api-tests`
  # starts the disposable local dependencies, migrates PostgreSQL and runs the
  # backend suite without adding pytest or test sources to the runtime image.
  api-tests:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: test
    environment:
      ENVIRONMENT: test
      RUNTIME_ROLE: api
      POSTGRES_URL: ${POSTGRES_URL:?Set POSTGRES_URL in the server environment}
      REDIS_URL: redis://redis:6379/0
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in the server environment}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in the server environment}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the server environment}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [ingestion_private]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ingestion
      POSTGRES_USER: ${POSTGRES_USER:-ingestion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion -d ingestion"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ingestion_private]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ingestion_private]

  minio:
    # O Docker Hub deixou de servir as imagens gratuitas da MinIO; o espelho
    # oficial é o quay.io. Fixada pelo digest: a mesma versão de antes, e uma
    # troca no registro não passa despercebida.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in the server environment}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in the server environment}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ingestion_private]

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    depends_on:
      - api
    ports:
      - "8080:80"
    networks: [ingestion_edge]

networks:
  # No host-published port ever reaches a container on this network — it has
  # no gateway to the outside. db/redis/minio/worker only ever need to talk
  # to each other and to the api container, never to the host or internet.
  ingestion_private:
    internal: true
  # api and web sit here too so the host (and Playwright/browsers) can reach
  # them via their published ports; this network is deliberately NOT internal.
  ingestion_edge: {}
  # Só o worker entra aqui, e só para falar com o leitor de fotos.
  reader_link: {}

volumes:
  postgres_data:
  minio_data:
