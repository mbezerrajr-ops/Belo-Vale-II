services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      ENVIRONMENT: development
      POSTGRES_URL: postgresql+asyncpg://ingestion:ingestion@db:5432/ingestion
      REDIS_URL: redis://redis:6379/0
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks: [ingestion_private]

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: ["python", "-c", "import time; time.sleep(3600)"]
    environment:
      ENVIRONMENT: development
      POSTGRES_URL: postgresql+asyncpg://ingestion:ingestion@db:5432/ingestion
      REDIS_URL: redis://redis:6379/0
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [ingestion_private]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ingestion
      POSTGRES_USER: ingestion
      POSTGRES_PASSWORD: ingestion
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion -d ingestion"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ingestion_private]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ingestion_private]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ingestion_private]

  web:
    image: nginx:1.27-alpine
    networks: [ingestion_private]

networks:
  ingestion_private:
    internal: true

volumes:
  postgres_data:
  minio_data:
